<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-users me-2"></i>
                Employee Tracker
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Navigation Sidebar -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-tasks me-2"></i>Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary" onclick="showSection('departments')">
                                <i class="fas fa-building me-2"></i>Departments
                            </button>
                            <button class="btn btn-outline-primary" onclick="showSection('roles')">
                                <i class="fas fa-briefcase me-2"></i>Roles
                            </button>
                            <button class="btn btn-outline-primary" onclick="showSection('employees')">
                                <i class="fas fa-user-tie me-2"></i>Employees
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9">
                <!-- Departments Section -->
                <div id="departments-section" class="content-section">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-building me-2"></i>Departments</h3>
                        <button class="btn btn-success" onclick="showAddDepartmentModal()">
                            <i class="fas fa-plus me-2"></i>Add Department
                        </button>
                    </div>
                    <div id="departments-table"></div>
                </div>

                <!-- Roles Section -->
                <div id="roles-section" class="content-section" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-briefcase me-2"></i>Roles</h3>
                        <button class="btn btn-success" onclick="showAddRoleModal()">
                            <i class="fas fa-plus me-2"></i>Add Role
                        </button>
                    </div>
                    <div id="roles-table"></div>
                </div>

                <!-- Employees Section -->
                <div id="employees-section" class="content-section" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-user-tie me-2"></i>Employees</h3>
                        <button class="btn btn-success" onclick="showAddEmployeeModal()">
                            <i class="fas fa-plus me-2"></i>Add Employee
                        </button>
                    </div>
                    <div id="employees-table"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Department Modal -->
    <div class="modal fade" id="addDepartmentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Department</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addDepartmentForm">
                        <div class="mb-3">
                            <label for="departmentName" class="form-label">Department Name</label>
                            <input type="text" class="form-control" id="departmentName" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addDepartment()">Add Department</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Role Modal -->
    <div class="modal fade" id="addRoleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Role</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addRoleForm">
                        <div class="mb-3">
                            <label for="roleTitle" class="form-label">Role Title</label>
                            <input type="text" class="form-control" id="roleTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="roleSalary" class="form-label">Salary</label>
                            <input type="number" class="form-control" id="roleSalary" required>
                        </div>
                        <div class="mb-3">
                            <label for="roleDepartment" class="form-label">Department</label>
                            <select class="form-select" id="roleDepartment" required>
                                <option value="">Select Department</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addRole()">Add Role</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEmployeeForm">
                        <div class="mb-3">
                            <label for="employeeFname" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="employeeFname" required>
                        </div>
                        <div class="mb-3">
                            <label for="employeeLname" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="employeeLname" required>
                        </div>
                        <div class="mb-3">
                            <label for="employeeRole" class="form-label">Role</label>
                            <select class="form-select" id="employeeRole" required>
                                <option value="">Select Role</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="employeeManager" class="form-label">Manager (Optional)</label>
                            <select class="form-select" id="employeeManager">
                                <option value="">No Manager</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addEmployee()">Add Employee</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Employee Role Modal -->
    <div class="modal fade" id="updateEmployeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Employee Role</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateEmployeeForm">
                        <div class="mb-3">
                            <label for="updateEmployeeSelect" class="form-label">Employee</label>
                            <select class="form-select" id="updateEmployeeSelect" required>
                                <option value="">Select Employee</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="updateEmployeeRole" class="form-label">New Role</label>
                            <select class="form-select" id="updateEmployeeRole" required>
                                <option value="">Select Role</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateEmployeeRole()">Update Role</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
